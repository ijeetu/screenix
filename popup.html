<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screenix</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
      <symbol id="icon-image" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <circle cx="9" cy="10" r="1.5"></circle>
        <path d="M21 15l-5-5L5 21"></path>
      </symbol>
      <symbol id="icon-layers" viewBox="0 0 24 24">
        <path d="M12 3l8 4.5-8 4.5-8-4.5L12 3z"></path>
        <path d="M4 12l8 4.5 8-4.5"></path>
        <path d="M4 16.5L12 21l8-4.5"></path>
      </symbol>
      <symbol id="icon-file-text" viewBox="0 0 24 24">
        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path>
        <path d="M14 3v5h5"></path>
        <path d="M9 13h6"></path>
        <path d="M9 17h6"></path>
      </symbol>
      <symbol id="icon-monitor" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="12" rx="2"></rect>
        <path d="M8 20h8"></path>
        <path d="M12 16v4"></path>
      </symbol>
      <symbol id="icon-scroll" viewBox="0 0 24 24">
        <rect x="6" y="3" width="12" height="18" rx="2"></rect>
        <path d="M12 7v10"></path>
        <path d="M9 14l3 3 3-3"></path>
      </symbol>
    </svg>

    <main class="shell">
      <section class="hero">
        <h1>Screenix</h1>
      </section>

      <section class="panel">
        <div class="panel__header">
          <h2>Mode</h2>
        </div>
        <div class="mode-grid" role="radiogroup" aria-label="Capture mode">
          <button class="choice-card" data-mode="visible" role="radio" aria-checked="true">
            <span class="choice-card__glyph">
              <svg class="choice-card__icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="#icon-monitor"></use>
              </svg>
            </span>
            <span class="choice-card__title">Current</span>
            <span class="choice-card__copy">Visible area</span>
          </button>
          <button class="choice-card" data-mode="full" role="radio" aria-checked="false">
            <span class="choice-card__glyph">
              <svg class="choice-card__icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="#icon-scroll"></use>
              </svg>
            </span>
            <span class="choice-card__title">Full</span>
            <span class="choice-card__copy">Whole page</span>
          </button>
        </div>
      </section>

      <section class="panel">
        <div class="panel__header">
          <h2>Format</h2>
        </div>
        <div class="format-grid" role="radiogroup" aria-label="Export format">
          <button class="format-pill" data-format="png" role="radio" aria-checked="true">
            <span class="format-pill__glyph">
              <svg class="format-pill__icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="#icon-image"></use>
              </svg>
            </span>
            <span class="format-pill__label">PNG</span>
          </button>
          <button class="format-pill" data-format="jpg" role="radio" aria-checked="false">
            <span class="format-pill__glyph">
              <svg class="format-pill__icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="#icon-image"></use>
              </svg>
            </span>
            <span class="format-pill__label">JPG</span>
          </button>
          <button class="format-pill" data-format="webp" role="radio" aria-checked="false">
            <span class="format-pill__glyph">
              <svg class="format-pill__icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="#icon-layers"></use>
              </svg>
            </span>
            <span class="format-pill__label">WEBP</span>
          </button>
          <button class="format-pill" data-format="pdf" role="radio" aria-checked="false">
            <span class="format-pill__glyph">
              <svg class="format-pill__icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="#icon-file-text"></use>
              </svg>
            </span>
            <span class="format-pill__label">PDF</span>
          </button>
        </div>
      </section>

      <section class="panel panel--dense">
        <div class="panel__header">
          <h2>Name</h2>
        </div>
        <label class="field">
          <span class="sr-only">Filename prefix</span>
          <input
            id="filename"
            name="filename"
            type="text"
            maxlength="60"
            placeholder="sxtension-shot"
            autocomplete="off"
          />
        </label>
      </section>

      <section id="qualityPanel" class="panel panel--dense">
        <div class="panel__header">
          <h2>Quality</h2>
          <span id="qualityLabel">92%</span>
        </div>
        <label id="qualityRange" class="range">
          <span class="range__tag">Light</span>
          <div class="range__track">
            <input id="quality" type="range" min="40" max="100" step="1" value="92" />
          </div>
          <span class="range__tag">Rich</span>
        </label>
        <p class="hint" id="qualityHint">PNG is lossless.</p>
      </section>

      <button id="captureButton" class="capture-button" type="button">
        <span class="capture-button__glow"></span>
        <span class="capture-button__label">Capture</span>
      </button>

      <p id="status" class="status" aria-live="polite"></p>

      <div class="credit">
        <span class="credit__heart">❤</span>
        <a class="credit__brand" href="https://vishwalabs.com" target="_blank" rel="noreferrer">
          <img src="assets/vishwalabs-logo.svg" alt="Vishwalabs" />
        </a>
        <a class="credit__link" href="https://vishwalabs.com" target="_blank" rel="noreferrer">Vishwa Labs</a>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
